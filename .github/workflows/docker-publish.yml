name: Publish Docker image

# Builds and pushes an image to the GitHub Container Registry on every push
# to main, so Watchtower can find and pull the latest version the same way
# it does for other home-lab containers - no manual git pull + docker
# compose up --build needed.
#
# Also bumps package.json's patch version on every push (not on a manual
# workflow_dispatch re-run) and commits that back to main, before building -
# so the running app always knows exactly which build it is (see the version
# line in Settings). Still 0.x.x, not full releases: see "Start versioning
# at 0.x instead of 1.x". The bump commit's [skip ci] marker stops GitHub
# from creating a workflow run for it, so this can't loop on itself.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Bump patch version
        if: github.event_name == 'push'
        run: |
          set -eu
          CURRENT=$(node -p "require('./package.json').version")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW="$MAJOR.$MINOR.$((PATCH + 1))"
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$NEW"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version to $NEW [skip ci]"
          git push

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io requires a lowercase image path, but github.repository keeps
      # whatever case the owner name actually has (e.g. "Growarr/growarr")
      # - so lowercase it here rather than pushing a tag that fails to parse.
      - name: Lowercase image path
        run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
