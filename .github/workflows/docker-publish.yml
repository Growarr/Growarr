name: Publish Docker image

# Builds and pushes an image to the GitHub Container Registry on every push
# to main, so Watchtower can find and pull the latest version the same way
# it does for other home-lab containers - no manual git pull + docker
# compose up --build needed.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io requires a lowercase image path, but github.repository keeps
      # whatever case the owner name actually has (e.g. "Growarr/growarr")
      # - so lowercase it here rather than pushing a tag that fails to parse.
      - name: Lowercase image path
        run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
