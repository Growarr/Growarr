name: Frost warning

# Checks SMHI's forecast once a night (18:00 Swedish time) for the lowest
# temperature over the coming day, and sends a push via ntfy if there is a
# frost risk.
on:
  schedule:
    - cron: "0 16 * * *" # 18:00 Swedish summer time / 17:00 winter time
  workflow_dispatch: {}

jobs:
  frost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check frost risk
        env:
          GEO_LAT: ${{ secrets.GEO_LAT }}
          GEO_LON: ${{ secrets.GEO_LON }}
          FROST_THRESHOLD: ${{ vars.FROST_THRESHOLD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: node src/frost.js
