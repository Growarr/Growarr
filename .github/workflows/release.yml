name: Release

# Runs only when a version tag is pushed (e.g. v0.1.0), on top of the
# existing docker-publish.yml which keeps :latest fresh on every push to
# main. This is what lets a docker-compose.yml pin a known-good version
# instead of always tracking whatever is newest.
#
# v0.x releases are marked "Pre-release" on GitHub automatically: semver's
# own meaning for a 0.x version is "anything may still change", which
# matches this project's actual state better than pretending otherwise.
# That stops the moment a v1.x tag is pushed - no extra step needed then.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ghcr.io requires a lowercase image path, but github.repository keeps
      # whatever case the owner name actually has (e.g. "Growarr/growarr")
      # - so lowercase it here rather than pushing a tag that fails to parse.
      - name: Lowercase image path
        run: echo "IMAGE=$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push version-tagged image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
