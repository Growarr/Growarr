services:
  growarr:
    image: ghcr.io/mathiasmholm/growarr:latest # built and pushed automatically by GitHub Actions, see .github/workflows/docker-publish.yml
    container_name: growarr
    restart: unless-stopped
    network_mode: host # same network mode as most other home-lab containers (Home Assistant, etc.)
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PORT=8097
      - HA_URL=http://localhost:8123
      - HA_TOKEN=            # a long-lived Home Assistant access token (reuse one you already have, or create a new one)
      - GEO_LAT=              # your garden's coordinates, e.g. 59.85
      - GEO_LON=              # e.g. 17.63
      - NTFY_TOPIC=           # ntfy.sh topic for harvest reminders (can also be set later via the gear icon in the panel)
      - WEBHOOK_URL=          # optional Home Assistant webhook, sent to in addition to ntfy
      - ANTHROPIC_API_KEY=    # optional, from console.anthropic.com - enables an AI-driven watering insight (otherwise a simple rule-based one is shown instead)
    volumes:
      - ./data:/data
