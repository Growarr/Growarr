services:
  tradgardsbevakning:
    image: ghcr.io/mathiasmholm/tradgardsbevakning:latest # byggs och pushas automatiskt av GitHub Actions, se .github/workflows/docker-publish.yml
    container_name: tradgardsbevakning
    restart: unless-stopped
    network_mode: host # samma som homeassistant/bostadsvakt-api/hushallsekonomi
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      - PORT=8097
      - HA_URL=http://localhost:8123
      - HA_TOKEN=            # samma långlivade token som för hushallsekonomi funkar fint
      - GEO_LAT=              # er trädgårds koordinater, t.ex. 59.85
      - GEO_LON=              # t.ex. 17.63
      - NTFY_TOPIC=           # samma ämne som Bostadsvakt/frostvarningen, för skördepåminnelser
      - WEBHOOK_URL=          # valfri HA-webhook (samma mönster som Bostadsvakts HA_WEBHOOK_URL), skickas till utöver ntfy
      - ANTHROPIC_API_KEY=    # valfri, från console.anthropic.com – ger en AI-driven bevattningsinsikt (annars visas en enkel regelbaserad istället)
    volumes:
      - ./data:/data
